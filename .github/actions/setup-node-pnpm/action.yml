name: Setup Node and pnpm
description: Setup pnpm, Node.js cache, and install dependencies
inputs:
  node-version:
    description: Node.js version used in CI
    required: false
    default: "22"
  pnpm-version:
    description: pnpm version used in CI
    required: false
    default: "9"
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
