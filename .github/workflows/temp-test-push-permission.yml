# comment-discipline-ok-file: o cabeçalho declara a hipótese sob teste — é a razão de o arquivo existir
# TEMPORÁRIO — validação de ARQ-462, remover após o teste.
#
# Segunda execução deste teste. Na primeira (run 4820), com as proteções ainda
# ativas, o push foi recusado com "Tag ... is protected" — o que provou que o
# token efêmero das Actions não é o `ci-runner-bot`. As proteções de branch e de
# tag foram removidas depois disso; agora o push deve passar, confirmando que o
# `release.yml` funciona com `secrets.GITHUB_TOKEN` e dispensa o `RELEASE_TOKEN`.
#
# Não versiona, não altera `master` e não publica nada: cria uma tag anotada
# descartável (mesmo tipo que o Nx cria), tenta empurrá-la e a remove em seguida.
name: TEMP - Test push permission

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-push:
    name: Testar push de tag com o token efêmero
    runs-on: gitea-runner
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.email "gitea-actions[bot]@noreply.lidercap.com.br"
          git config user.name "gitea-actions[bot]"

      - name: Criar e empurrar tag descartável
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TAG="temp-test-push-permission-${RUN_ID}"
          echo "Tag de teste: ${TAG}"
          git tag --annotate "${TAG}" -m "teste de permissao de push (descartavel, ARQ-462)"
          echo "Empurrando com a identidade do token efêmero das Actions..."
          git push origin "${TAG}"
          echo "RESULTADO: PUSH ACEITO — o token efêmero empurra tags neste repositório."

      - name: Remover a tag do remoto
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          TAG="temp-test-push-permission-${RUN_ID}"
          git push origin ":refs/tags/${TAG}" \
            && echo "Tag removida do remoto." \
            || echo "Nada a remover (a tag provavelmente não chegou a subir)."
