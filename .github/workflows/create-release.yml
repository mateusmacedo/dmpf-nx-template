name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: "Semantic version increment type"
        type: choice
        options:
          - auto
          - minor
          - patch
          - major
        default: auto

concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    name: Create Release Branch
    runs-on: gitea-runner
    timeout-minutes: 10

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all branches
        run: git fetch --all

      - name: Resolve bump type
        id: bump
        run: |
          BUMP="${{ inputs.bump-type }}"

          if [[ "$BUMP" == "auto" ]]; then
            COMMITS=$(git log origin/master..origin/develop --pretty=format:"%s" 2>/dev/null || echo "")

            if echo "$COMMITS" | grep -qE "(BREAKING[[:space:]]CHANGE|^[a-z]+(\(.+\))?!:)"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi

            echo "Auto-detected bump type: $BUMP"
          fi

          echo "value=$BUMP" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: version
        run: |
          # Find the latest release cycle version from previously merged release/* branches
          LATEST_CYCLE=$(git branch -r --merged origin/master \
            | grep -oE 'release/[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | sort -V | tail -1 || echo "")

          if [[ -z "$LATEST_CYCLE" ]]; then
            CURRENT="0.0.0"
          else
            CURRENT="$LATEST_CYCLE"
          fi

          echo "Current release cycle version: $CURRENT"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          BUMP="${{ steps.bump.outputs.value }}"

          case "$BUMP" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "Next version: $NEXT"
          echo "value=$NEXT" >> $GITHUB_OUTPUT

      - name: Create and push release branch
        run: |
          BRANCH="release/${{ steps.version.outputs.value }}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists on origin."
            exit 1
          fi

          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

      - name: Open pull request
        run: |
          gh pr create \
            --base master \
            --head "release/${{ steps.version.outputs.value }}" \
            --title "release: ${{ steps.version.outputs.value }}" \
            --body "$(cat <<'EOF'
          ## Release ${{ steps.version.outputs.value }}

          **Bump type:** ${{ steps.bump.outputs.value }}

          ### Checklist

          - [ ] Features validadas em \`develop\`
          - [ ] Features mergeadas nesta branch
          - [ ] QA aprovado em homologação
          - [ ] Changelog revisado

          ---
          > Branch criada automaticamente via workflow *Create Release Branch*
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
