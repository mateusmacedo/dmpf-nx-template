name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type (affects docker versioning)'
        type: choice
        options:
          - production
          - hotfix
        default: production

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Nx Release
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        (
          startsWith(github.event.pull_request.head.ref, 'release/') ||
          startsWith(github.event.pull_request.head.ref, 'hotfix/')
        )
      )
    runs-on: k8s-actions-runner
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate manual dispatch branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "::error::Manual release is allowed only from master. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '22'
          pnpm-version: '9'

      - name: Setup npm registry auth
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@lideranca-sites'

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Resolve docker version scheme
        id: docker-scheme
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          MANUAL_TYPE="${{ inputs.release-type }}"
          if [[ "$HEAD_REF" == hotfix/* ]] || [[ "$MANUAL_TYPE" == "hotfix" ]]; then
            echo "value=hotfix" >> $GITHUB_OUTPUT
          else
            echo "value=production" >> $GITHUB_OUTPUT
          fi

      - name: Detect npm bootstrap mode
        id: npm-bootstrap
        run: |
          HAS_NPM_RELEASE_TAG=$(
            node -e "
              const { execSync } = require('node:child_process');
              const tags = execSync('git tag --list', { encoding: 'utf8' })
                .split('\n')
                .map((tag) => tag.trim())
                .filter(Boolean);
              const hasProjectReleaseTag = tags.some((tag) => /^@lideranca-sites\/[^@]+@.+$/.test(tag));
              process.stdout.write(hasProjectReleaseTag ? 'true' : 'false');
            "
          )

          LIBS_JSON=$(pnpm nx show projects --projects=\"tag:type:lib\" --json)
          PACKAGE_NAMES=$(node -e "
            const projects = JSON.parse(process.argv[1] ?? '[]');
            const names = projects.filter((name) => typeof name === 'string' && name.startsWith('@lideranca-sites/'));
            process.stdout.write(names.join(','));
          " "$LIBS_JSON")

          HAS_PACKAGE_IN_REGISTRY=false
          IFS=',' read -ra PACKAGES <<< "$PACKAGE_NAMES"
          for PACKAGE_NAME in "${PACKAGES[@]}"; do
            [[ -z "$PACKAGE_NAME" ]] && continue
            if npm view "$PACKAGE_NAME" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              HAS_PACKAGE_IN_REGISTRY=true
              break
            fi
          done

          if [[ "$HAS_NPM_RELEASE_TAG" == "false" && "$HAS_PACKAGE_IN_REGISTRY" == "false" ]]; then
            echo "use_first_release=true" >> "$GITHUB_OUTPUT"
            echo "Bootstrap mode enabled: no release tags and no package found in registry."
          else
            echo "use_first_release=false" >> "$GITHUB_OUTPUT"
            echo "Standard mode enabled: existing release tags or existing package detected in registry."
          fi

      - name: Dry-run release plan (bootstrap)
        if: steps.npm-bootstrap.outputs.use_first_release == 'true'
        id: release-plan-bootstrap
        run: |
          DRY_RUN_LOG=$(mktemp)
          pnpm nx release version --groups=npm-libs --first-release --dry-run 2>&1 | tee "$DRY_RUN_LOG"
          if grep -q "No files changed as a result of running versioning" "$DRY_RUN_LOG"; then
            echo "would_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release changes detected in bootstrap dry-run."
          else
            echo "would_release=true" >> "$GITHUB_OUTPUT"
            echo "Release changes detected in bootstrap dry-run."
          fi

      - name: Dry-run release plan (standard)
        if: steps.npm-bootstrap.outputs.use_first_release != 'true'
        id: release-plan-standard
        run: |
          DRY_RUN_LOG=$(mktemp)
          pnpm nx release version --groups=npm-libs --dry-run 2>&1 | tee "$DRY_RUN_LOG"
          if grep -q "No files changed as a result of running versioning" "$DRY_RUN_LOG"; then
            echo "would_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release changes detected in standard dry-run."
          else
            echo "would_release=true" >> "$GITHUB_OUTPUT"
            echo "Release changes detected in standard dry-run."
          fi

      - name: Execute release (bootstrap)
        if: steps.npm-bootstrap.outputs.use_first_release == 'true' && steps.release-plan-bootstrap.outputs.would_release == 'true'
        run: pnpm nx release --groups=npm-libs --first-release --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute release (standard)
        if: steps.npm-bootstrap.outputs.use_first_release != 'true' && steps.release-plan-standard.outputs.would_release == 'true'
        run: pnpm nx release --groups=npm-libs --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release tags from current commit
        id: release-tags
        run: |
          WOULD_RELEASE="${{ steps.release-plan-bootstrap.outputs.would_release || steps.release-plan-standard.outputs.would_release }}"
          if [[ "$WOULD_RELEASE" != "true" ]]; then
            echo "has_release_tags=false" >> "$GITHUB_OUTPUT"
            echo "tags_csv=" >> "$GITHUB_OUTPUT"
            echo "::notice::Release execution skipped due to no-op dry-run."
            exit 0
          fi

          TAGS=$(git tag --points-at HEAD | tr '\n' ',' | sed 's/,$//')
          if [[ -z "$TAGS" ]]; then
            echo "has_release_tags=false" >> "$GITHUB_OUTPUT"
            echo "tags_csv=" >> "$GITHUB_OUTPUT"
            echo "::error::Release was expected, but no tags were created on HEAD."
            exit 1
          else
            echo "has_release_tags=true" >> "$GITHUB_OUTPUT"
            echo "tags_csv=$TAGS" >> "$GITHUB_OUTPUT"
            echo "Release tags created on HEAD: $TAGS"
          fi

      - name: Validate release tag pattern
        if: steps.release-tags.outputs.has_release_tags == 'true'
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.release-tags.outputs.tags_csv }}"
          for TAG in "${TAG_ARRAY[@]}"; do
            if [[ ! "$TAG" =~ ^@lideranca-sites/[^@]+@.+$ ]]; then
              echo "::error::Invalid release tag format: $TAG"
              exit 1
            fi
          done

      - name: Validate GitHub releases for created tags
        if: steps.release-tags.outputs.has_release_tags == 'true'
        env:
          TAGS_CSV: ${{ steps.release-tags.outputs.tags_csv }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const tags = (process.env.TAGS_CSV || '').split(',').map((tag) => tag.trim()).filter(Boolean);
            if (tags.length === 0) {
              throw new Error('Expected release tags, but none were provided to validation step.');
            }
            const repo = process.env.REPOSITORY;
            const token = process.env.GITHUB_TOKEN;
            (async () => {
              for (const tag of tags) {
                const encoded = encodeURIComponent(tag);
                const url = 'https://api.github.com/repos/' + repo + '/releases/tags/' + encoded;
                const response = await fetch(url, {
                  headers: {
                    'Authorization': 'Bearer ' + token,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                  }
                });
                if (!response.ok) {
                  const body = await response.text();
                  throw new Error('Missing GitHub release for tag ' + tag + '. Status: ' + response.status + '. Body: ' + body);
                }
              }
              console.log('Validated GitHub release for tags:', tags.join(', '));
            })().catch((error) => {
              console.error(error.message);
              process.exit(1);
            });
          "

      - name: Release summary
        if: always()
        run: |
          echo "first_release=${{ steps.npm-bootstrap.outputs.use_first_release }}"
          echo "would_release=${{ steps.release-plan-bootstrap.outputs.would_release || steps.release-plan-standard.outputs.would_release }}"
          echo "has_release_tags=${{ steps.release-tags.outputs.has_release_tags }}"
          echo "tags=${{ steps.release-tags.outputs.tags_csv }}"

      - name: Detect docker release candidates
        id: docker-candidates
        run: |
          APPS_JSON=$(pnpm nx show projects --projects="tag:type:app" --json)
          APPS_COUNT=$(node -e "const projects = JSON.parse(process.argv[1] ?? '[]'); console.log(Array.isArray(projects) ? projects.length : 0);" "$APPS_JSON")
          APPS_CSV=$(node -e "const projects = JSON.parse(process.argv[1] ?? '[]'); console.log(Array.isArray(projects) ? projects.join(',') : '');" "$APPS_JSON")

          if [[ "$APPS_COUNT" -gt 0 ]]; then
            echo "has_docker_apps=true" >> "$GITHUB_OUTPUT"
            echo "projects_csv=$APPS_CSV" >> "$GITHUB_OUTPUT"
            echo "Docker release enabled for projects: $APPS_CSV"
          else
            echo "has_docker_apps=false" >> "$GITHUB_OUTPUT"
            echo "projects_csv=" >> "$GITHUB_OUTPUT"
            echo "No docker release candidates found for tag:type:app. Skipping Docker steps."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.docker-candidates.outputs.has_docker_apps == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release — docker apps
        if: steps.docker-candidates.outputs.has_docker_apps == 'true'
        run: pnpm nx release --projects="${{ steps.docker-candidates.outputs.projects_csv }}" --dockerVersionScheme=${{ steps.docker-scheme.outputs.value }} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
