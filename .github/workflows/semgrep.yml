name: Semgrep Supply-Chain Gate

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write # required for SARIF upload to GitHub Security tab

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: [self-hosted]
    container:
      image: 975050052771.dkr.ecr.us-east-1.amazonaws.com/semgrep/semgrep:latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SCA diff analysis needs full history to detect dep changes

      - name: Run Semgrep CI
        id: semgrep
        continue-on-error: true # let upload-sarif run even when findings block
        run: semgrep ci --sarif-output "$GITHUB_WORKSPACE/semgrep.sarif"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep-supply-chain
        continue-on-error: true # skip gracefully if GitHub Advanced Security not enabled

      - name: Assert no blocking findings
        if: always()
        run: |
          [ "${{ steps.semgrep.outcome }}" = "success" ] || exit 1
