name: Detect Apps

# WHY: as apps vivem em apps/<scope>/<app> (dois níveis), e o glob por diretório
# devolvia sempre []. O grafo do Nx resolve o que mudou desde o último run verde
# deste workflow na branch, inclusive via libs, sem lista de diretórios.
on:
  workflow_call:
    inputs:
      marker_file:
        description: "Arquivo que identifica uma app deployável (ex: 'Dockerfile')"
        required: false
        type: string
        default: "Dockerfile"
      runner:
        description: "Runner para execução"
        required: false
        type: string
        default: "ubuntu-26.04"
    outputs:
      apps:
        description: "JSON array com o root das apps detectadas (ex: [\"apps/backend/minha-app\"])"
        value: ${{ jobs.detect.outputs.apps }}

permissions: {}

jobs:
  detect:
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Set Nx SHAs for affected (base/head)
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: ${{ github.ref_name }}
          last-successful-event: ${{ github.event_name }}

      - id: set
        shell: bash
        env:
          MARKER_FILE: ${{ inputs.marker_file }}
        run: |
          set -euo pipefail
          apps=()
          while IFS= read -r projeto; do
            raiz="$(pnpm --silent nx show project "$projeto" --json | jq -r .root)"
            [ -f "$raiz/$MARKER_FILE" ] && apps+=("$raiz")
          done < <(pnpm --silent nx show projects --affected --type app --json | jq -r '.[]')
          if [ ${#apps[@]} -eq 0 ]; then
            echo "apps=[]" >> "$GITHUB_OUTPUT"
          else
            echo "apps=$(printf '%s\n' "${apps[@]}" | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          fi
