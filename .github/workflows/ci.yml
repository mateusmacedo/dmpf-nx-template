name: CI

on:
  pull_request:
    branches:
      - master
      - develop
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  NODE_AUTH_TOKEN: ${{ github.token }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  main:
    name: Nx Affected Pipeline
    permissions:
      actions: read
      contents: read
      packages: read
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      NX_EXCLUDE: "@nx-base-template/source,tag:stack:go"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Set Nx SHAs for affected (base/head)
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Check formatting and linting
        run: pnpm biome ci .

      - name: Lint (affected)
        run: pnpm nx affected -t lint --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=$NX_EXCLUDE

      - name: Typecheck (affected)
        run: pnpm nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=$NX_EXCLUDE

      - name: Test (affected)
        run: pnpm nx affected -t test --base=$NX_BASE --head=$NX_HEAD --parallel=3 --ci --coverage --exclude=$NX_EXCLUDE

      - name: Build (affected)
        run: pnpm nx affected -t build --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=$NX_EXCLUDE

      - name: E2E (affected)
        run: pnpm nx affected -t e2e --base=$NX_BASE --head=$NX_HEAD --parallel=1 --exclude=$NX_EXCLUDE

  template-smoke:
    name: Template smoke (DMPF)
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
          install: "false"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work
            pnpm-lock.yaml

      - name: Template smoke
        run: bash tools/template-smoke.sh
