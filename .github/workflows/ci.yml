name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    name: Nx Affected Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs (base/head para affected)
        uses: nrwl/nx-set-shas@v4

      - name: Check formatting
        run: pnpm nx format:check

      - name: Lint (affected)
        run: pnpm nx affected -t lint --parallel=3

      - name: Typecheck (affected)
        run: pnpm nx affected -t typecheck --parallel=3

      - name: Test (affected)
        run: pnpm nx affected -t test --parallel=3 --ci --coverage

      - name: Build (affected)
        run: pnpm nx affected -t build --parallel=3

      - name: E2E (affected)
        run: pnpm nx affected -t e2e --parallel=1
