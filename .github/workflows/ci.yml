name: CI

on:
  pull_request:
    branches:
      - master
      - develop
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  main:
    name: Nx Affected Pipeline
    runs-on: k8s-actions-runner
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '22'
          pnpm-version: '9'

      - name: Set Nx SHAs for affected (base/head)
        uses: nrwl/nx-set-shas@v4

      - name: Check formatting and linting
        run: pnpm biome ci .

      - name: Lint (affected)
        run: pnpm nx affected -t lint --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=@nx-base-template/source

      - name: Typecheck (affected)
        run: pnpm nx affected -t typecheck --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=@nx-base-template/source

      - name: Test (affected)
        run: pnpm nx affected -t test --base=$NX_BASE --head=$NX_HEAD --parallel=3 --ci --coverage --exclude=@nx-base-template/source

      - name: Build (affected)
        run: pnpm nx affected -t build --base=$NX_BASE --head=$NX_HEAD --parallel=3 --exclude=@nx-base-template/source

      - name: E2E (affected)
        run: pnpm nx affected -t e2e --base=$NX_BASE --head=$NX_HEAD --parallel=1 --exclude=@nx-base-template/source
